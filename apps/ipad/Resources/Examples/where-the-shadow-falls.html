<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Where does the shadow fall?</title><style>
:root{--ink:#17324d;--sun:#e2a63b;--ground:#315f5b;--paper:#f6f0e3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px 20px 22px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px}h1{font-size:clamp(27px,5vw,44px);line-height:1;margin:0}header p{max-width:360px;margin:0;line-height:1.4}#scene{display:block;width:100%;height:auto;margin:18px 0 0;background:#fbf8ef;border-bottom:2px solid var(--ground);touch-action:none}#scene text{font:13px system-ui,sans-serif;fill:var(--ink)}#lamp{cursor:grab;touch-action:none}#lamp:active{cursor:grabbing}.readout{display:flex;gap:28px;padding:11px 0;border-bottom:1px solid #b8b09f}.readout strong{font-size:20px}.prediction{padding-top:20px}.prediction>p{margin:0 0 10px}.questions{display:grid;grid-template-columns:1fr 1fr;gap:20px}.questions fieldset{border:0;border-top:1px solid #b8b09f;padding:18px 0 0;margin:0}.questions legend{font-weight:750;padding:0}.choices{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.choices button,button{min-height:44px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 12px;font:inherit}.choices button.selected{background:var(--ink);color:var(--paper)}.button-row{display:flex;gap:14px;margin-top:18px}button.primary{background:var(--ink);color:var(--paper);font-weight:750}button.reset{background:transparent}#feedback{min-height:44px;line-height:1.4;margin:12px 0 0}@media(max-width:600px){main{padding:14px}.questions{grid-template-columns:1fr;gap:10px}header{display:block}header p{margin-top:10px}.readout{gap:15px}.button-row{flex-wrap:wrap}}
</style></head><body><main><header><div><h1>Where does the shadow fall?</h1></div><p>Light travels in straight lines. Predict first, then drag the lamp and compare.</p></header><svg id="scene" viewBox="0 0 720 300" role="img" aria-label="A draggable lamp shining towards a fixed block on a ground line"><line x1="70" y1="250" x2="680" y2="250" stroke="#315f5b" stroke-width="5"/><line x1="90" y1="270" x2="600" y2="270" stroke="#d5cbb8" stroke-width="2" stroke-dasharray="4 8"/><polygon id="shadow" fill="#e2a63b" fill-opacity=".42"/><line id="ray1" stroke="#e2a63b" stroke-width="2" stroke-dasharray="6 5"/><line id="ray2" stroke="#e2a63b" stroke-width="2" stroke-dasharray="6 5"/><rect x="335" y="145" width="60" height="105" fill="#17324d"/><text x="365" y="141" text-anchor="middle">fixed object</text><g id="lamp" tabindex="0" role="button" aria-label="Drag lamp left or right"><path id="beam" fill="#e2a63b" fill-opacity=".18"/><rect x="90" y="53" width="44" height="20" rx="4" fill="#17324d"/><circle cx="112" cy="84" r="12" fill="#e2a63b"/><line x1="112" y1="96" x2="112" y2="112" stroke="#17324d" stroke-width="4"/><text x="112" y="38" text-anchor="middle">lamp</text></g><text x="70" y="289">drag along the track</text></svg><div class="readout"><span>Shadow: <strong id="direction">?</strong></span><span>Length: <strong id="length">?</strong></span><span id="moved">starting position</span></div><section class="prediction"><p><strong>Before moving it, predict the starting shadow.</strong></p><div class="questions"><fieldset><legend>Which side?</legend><div class="choices" data-question="direction"><button data-value="left">left</button><button data-value="under">under</button><button data-value="right">right</button></div></fieldset><fieldset><legend>How long?</legend><div class="choices" data-question="length"><button data-value="short">short</button><button data-value="long">long</button></div></fieldset></div><div class="button-row"><button class="primary" id="check">Check prediction</button><button class="reset" id="reset">Reset</button></div><p id="feedback" aria-live="polite"></p></section></main><script>
const scene=document.getElementById('scene'),lamp=document.getElementById('lamp'),shadow=document.getElementById('shadow'),ray1=document.getElementById('ray1'),ray2=document.getElementById('ray2'),beam=document.getElementById('beam'),directionText=document.getElementById('direction'),lengthText=document.getElementById('length');let lampX=180,dragging=false,revealed=false;const initialX=180,clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),project=x=>clamp(lampX+(x-lampX)*(250-64)/(145-64),20,700);function state(){let d=lampX<315?'right':lampX>415?'left':'under',far,near;if(d==='right'){near=395;far=project(395)}else if(d==='left'){near=project(335);far=335}else{near=Math.min(335,project(335));far=Math.max(395,project(395))}const size=Math.round(far-near);return{d,l:size>190?'long':'short',near,far}}function draw(){const s=state(),pLeft=project(335),pRight=project(395);shadow.setAttribute('points',s.d==='right'?`335 145 395 145 ${s.far} 250 395 250`:s.d==='left'?`335 145 395 145 335 250 ${s.near} 250`:`335 145 395 145 ${s.far} 250 ${s.near} 250`);ray1.setAttribute('x1',lampX);ray1.setAttribute('y1',64);ray1.setAttribute('x2',pLeft);ray1.setAttribute('y2',250);ray2.setAttribute('x1',lampX);ray2.setAttribute('y1',64);ray2.setAttribute('x2',pRight);ray2.setAttribute('y2',250);beam.setAttribute('d',`M${lampX} 64 L335 145 L395 145 Z`);lamp.setAttribute('transform',`translate(${lampX-112} 0)`);directionText.textContent=revealed?s.d:'?';lengthText.textContent=revealed?s.l:'?';document.getElementById('moved').textContent=lampX===initialX?'starting position':'moved lamp'}scene.addEventListener('pointerdown',e=>{if(e.target.closest('#lamp')){dragging=true;lamp.setPointerCapture(e.pointerId)}});scene.addEventListener('pointermove',e=>{if(!dragging)return;const r=scene.getBoundingClientRect();lampX=clamp((e.clientX-r.left)*720/r.width,90,620);draw()});scene.addEventListener('pointerup',()=>dragging=false);scene.addEventListener('pointercancel',()=>dragging=false);lamp.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){lampX=clamp(lampX-20,90,620);draw()}else if(e.key==='ArrowRight'){lampX=clamp(lampX+20,90,620);draw()}});document.querySelectorAll('.choices').forEach(c=>c.onclick=e=>{if(e.target.tagName!=='BUTTON')return;c.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));e.target.classList.add('selected');c.dataset.answer=e.target.dataset.value});document.getElementById('check').onclick=()=>{const s=state(),direction=document.querySelector('[data-question="direction"]').dataset.answer,length=document.querySelector('[data-question="length"]').dataset.answer;if(!direction||!length){document.getElementById('feedback').textContent='Choose both answers before checking.';return}const dirOk=direction===s.d,lenOk=length===s.l;revealed=true;draw();document.getElementById('feedback').textContent=dirOk&&lenOk?'✓ Correct! Your prediction matched the actual shadow.':(dirOk?'✗ The side was right, but the length was wrong.':(lenOk?'✗ The length was right, but the side was wrong.':'✗ Both predictions were wrong. Try again!'))};document.getElementById('reset').onclick=()=>{lampX=initialX;dragging=false;revealed=false;document.querySelectorAll('.choices button').forEach(b=>b.classList.remove('selected'));document.querySelectorAll('.choices').forEach(c=>delete c.dataset.answer);document.getElementById('feedback').textContent='';draw()};draw();
</script></body></html>
